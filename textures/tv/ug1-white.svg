<?xml version="1.0" encoding="UTF-8"?>
<!-- Логотип вымышленного канала «УГ-1», белая версия — «жучок» в углу кадра.
     Публичная атрибутика (пак retro-legends): к реальному вещателю отношения
     не имеет. «У», дефис и «1» взяты из стилистики эпохи, «Г» построена с нуля.
     Наклон всех вертикальных штрихов один: dx/dy = -0.4196. Поле шире, чем у
     УТ-1: у Г стойка слева, поэтому «У» и «Г» обязаны разойтись, а знак
     раздался вправо. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 106" width="190" height="106">
  <!-- «У» отдельным знаком -->
  <path fill="#ffffff" d="M 25.76,31.47 H 41.90 L 45.16,44.14 51.53,31.47 H 64.27 L 47.28,71.95 H 30.29 l 6.23,-13.80 z"/>
  <!-- «Г»: перекладина и стойка от ЛЕВОГО её конца -->
  <path fill="#ffffff" d="M 80.00,31.47 H 118.00 L 113.81,41.45 H 95.60 L 78.61,71.95 H 63.01 Z"/>
  <!-- дефис -->
  <path fill="#ffffff" d="M 108.45,48.53 125.43,48.81 122.60,57.87 H 105.62 Z"/>
  <!-- единица -->
  <path fill="#ffffff" d="M 128.55,71.95 145.54,31.47 H 161.39 L 142.42,71.95 Z"/>
</svg>
